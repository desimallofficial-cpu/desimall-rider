<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Return Pickups - DesiMall</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css?v=0.32.3"><link rel="stylesheet" href="../css/rider.css?v=1.0.4"><link rel="stylesheet" href="../css/rider-returns-v2.css?v=0.32.3">
<script id="dmReleaseBootstrap">
(() => {
  const RELEASE = 'v0.32.3';
  window.DESIMALL_RELEASE = RELEASE;
  try {
    const prev = localStorage.getItem('desimall_release');
    if (prev !== RELEASE) {
      localStorage.setItem('desimall_release', RELEASE);
      if ('caches' in window) {
        caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).catch(() => {});
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.update())).catch(() => {});
      }
    }
  } catch (_) {}
})();
</script>

</head><body><div class="r-shell"><aside class="r-side"><div class="r-brand">Desi<span>Mall</span></div><div class="r-user"><strong id="riderName">Rider</strong><small id="riderMeta">Delivery Partner</small></div><nav class="r-nav"><a href="dashboard.html"><i class="fa-solid fa-truck"></i> Deliveries</a><a class="active" href="returns.html"><i class="fa-solid fa-rotate-left"></i> Return Pickups</a><a href="earnings.html"><i class="fa-solid fa-wallet"></i> Rider Account</a><a href="support.html"><i class="fa-solid fa-headset"></i> Support</a><button id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button></nav></aside><main class="r-main"><header class="r-head"><div><h1>Return Pickups</h1><p>Collect assigned returns with OTP and proof, then deposit them at the seller/warehouse.</p></div><div class="r-head-actions"><span id="liveState" class="r-live"><i class="fa-solid fa-circle"></i> Live</span><button class="r-btn secondary" id="refreshBtn"><i class="fa-solid fa-rotate"></i> Refresh</button></div></header><section class="r-stats"><article class="r-stat"><span>Total Assigned</span><strong id="totalCount">0</strong></article><article class="r-stat"><span>Pickup Pending</span><strong id="assignedCount">0</strong></article><article class="r-stat"><span>Collected</span><strong id="pickedCount">0</strong></article><article class="r-stat"><span>Deposited</span><strong id="receivedCount">0</strong></article></section><section class="r-panel"><div class="r-toolbar"><input id="searchInput" placeholder="Search return ID, order, customer or product"><select id="statusFilter"><option value="">All Statuses</option><option>Pickup Assigned</option><option>Rider Accepted</option><option>Picked Up</option><option>Received</option><option>Inspection Passed</option><option>Refund Completed</option></select></div><div id="returns" class="r-return-grid"></div></section></main></div><div class="r-modal" id="proofModal"><div class="r-modal-card r-proof-modal"><button class="r-modal-x" id="closeModal">×</button><h2 id="modalTitle">Return Pickup</h2><p id="modalProduct" class="r-muted"></p><div id="otpField"><label>Customer 4-digit OTP<input id="pickupOtp" maxlength="4" inputmode="numeric" placeholder="0000"></label></div><div id="receiverFields" hidden><label>Received by<input id="receivedBy" maxlength="160" placeholder="Seller / warehouse staff"></label><label>Deposit note<textarea id="receiverNote" rows="3" maxlength="500"></textarea></label></div><label>Proof photo<input id="proofFile" type="file" accept="image/png,image/jpeg,image/webp" capture="environment"></label><div id="proofPreview"></div><button class="r-btn success" id="submitProof"><i class="fa-solid fa-check"></i> Complete</button></div></div><div id="riderToast" class="r-toast"></div><script src="../js/api.js?v=0.32.3"></script><script src="../js/rider-returns.js?v=0.32.3"></script></body></html>
