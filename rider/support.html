<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rider Support - DesiMall</title><link rel="stylesheet" href="../css/rider.css?v=0.32.3"><link rel="stylesheet" href="../css/support.css?v=0.32.3">
<script id="dmReleaseBootstrap">
(() => {
  const RELEASE = 'v0.32.3';
  window.DESIMALL_RELEASE = RELEASE;
  try {
    const prev = localStorage.getItem('desimall_release');
    if (prev !== RELEASE) {
      localStorage.setItem('desimall_release', RELEASE);
      if ('caches' in window) {
        caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).catch(() => {});
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.update())).catch(() => {});
      }
    }
  } catch (_) {}
})();
</script>

</head><body>
<div class="r-shell"><aside class="r-side"><div class="r-brand">Desi<span>Mall</span></div><div class="r-user"><strong id="riderName">Rider</strong><small>Delivery Partner</small></div><nav class="r-nav"><a href="dashboard.html">Deliveries</a><a href="returns.html">Return Pickups</a><a href="earnings.html">Rider Account</a><a class="active" href="support.html">Support</a><button id="logoutBtn">Logout</button></nav></aside>
<main class="r-main"><header class="r-head"><div><h1>Rider Support</h1><p>Delivery, COD, payout, return pickup ya account issue ke liye support ticket banayein.</p></div><button class="r-btn secondary" id="refreshRiderSupport">Refresh</button></header>
<section class="r-panel"><div class="r-toolbar"><button class="r-btn" id="newRiderTicket">New Ticket</button></div><div class="support-layout"><div id="riderTicketList" class="ticket-list"></div><div id="riderTicketDetail" class="support-empty"><strong>Select a ticket</strong></div></div></section></main></div>
<div class="modal" id="riderTicketModal"><div class="modal-box support-modal"><div class="modal-head"><h2>New Rider Support Ticket</h2><button class="close-btn" id="closeRiderTicket">×</button></div><form id="riderTicketForm" class="form-grid"><div class="field"><label>Category</label><select id="riderCategory" required><option>Delivery</option><option>COD</option><option>Payout</option><option>Return Pickup</option><option>Account / KYC</option><option>Other</option></select></div><div class="field"><label>Priority</label><select id="riderPriority"><option>Low</option><option selected>Medium</option><option>High</option><option>Urgent</option></select></div><div class="field full"><label>Subject</label><input id="riderSubject" required></div><div class="field full"><label>Description</label><textarea id="riderDescription" rows="5" required></textarea></div><div class="field full"><button class="r-btn">Submit Ticket</button></div></form></div></div>
<script src="../js/api.js?v=0.32.3"></script><script src="../js/rider-support.js?v=0.32.3"></script></body></html>
