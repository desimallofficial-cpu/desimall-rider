<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rider Login - DesiMall</title>
  <link rel="stylesheet" href="../css/rider.css">
</head>

<body class="r-login">
<main class="r-auth">
  <h1>Desi<span style="color:#ff6b00">Mall</span> Rider</h1>
  <p>Delivery partner login.</p>

  <div class="r-tabs">
    <button id="loginTab" class="active">Login</button>
    <button id="registerTab">Register</button>
  </div>

  <form id="loginForm" class="r-form">
    <label>Mobile or email
      <input id="identifier" required>
    </label>

    <label>Password
      <input id="password" type="password" required>
    </label>

    <button class="r-btn">Login</button>
  </form>

  <form id="registerForm" class="r-form hidden">
    <label>Full name<input id="rName" required></label>
    <label>Mobile<input id="rMobile" maxlength="10" required></label>
    <label>Email<input id="rEmail" type="email" required></label>

    <label>Vehicle type
      <select id="rVehicle">
        <option>Bike</option>
        <option>Scooter</option>
        <option>Cycle</option>
        <option>Auto</option>
      </select>
    </label>

    <label>Vehicle number<input id="rVehicleNo"></label>
    <label>Service pincode<input id="rPincode" maxlength="6"></label>
    <label>Password<input id="rPassword" type="password" minlength="6" required></label>

    <button class="r-btn">Register rider</button>
  </form>

  <div id="msg" class="r-msg"></div>
</main>

<script src="../js/api.js"></script>
<script src="../js/rider-auth.js"></script>
</body>
</html>
