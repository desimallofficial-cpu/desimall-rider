<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Rider Password</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1017;color:#fff;font-family:Inter,system-ui}.card{width:min(410px,92vw);background:#111b27;border:1px solid #304158;border-radius:14px;padding:22px}.card input{width:100%;box-sizing:border-box;padding:11px;margin:7px 0;border-radius:8px;border:1px solid #304158;background:#0d1723;color:#fff}.btn{width:100%;padding:11px;border:0;border-radius:8px;background:#ff6b00;color:#fff;font-weight:900}.msg{font-size:10px;color:#9fb0c5;margin-top:9px}</style></head><body><div class="card"><h2>Reset Rider Password</h2><input id="pw" type="password" minlength="6" placeholder="New password"><input id="pw2" type="password" minlength="6" placeholder="Confirm password"><button id="save" class="btn">Update password</button><div id="msg" class="msg"></div></div><script src="../js/api.js?v=0.34.0"></script><script>const q=()=>{const h=new URLSearchParams(location.hash.slice(1));return{a:h.get('access_token')||'',r:h.get('refresh_token')||''}};save.onclick=async()=>{const x=q();if(!x.a||!x.r)return msg.textContent='Invalid or expired reset link. Request a new one.';if(pw.value.length<6||pw.value!==pw2.value)return msg.textContent='Passwords must match and be at least 6 characters.';save.disabled=true;try{const r=await DesiMallAPI.riderPasswordResetComplete({AccessToken:x.a,RefreshToken:x.r,Password:pw.value});if(!r.success)throw new Error(r.message||'Reset failed');msg.textContent=r.message||'Password updated.';setTimeout(()=>location.replace('login.html'),1200)}catch(e){msg.textContent=e.message||'Could not reset password.'}finally{save.disabled=false}};</script></body></html>
